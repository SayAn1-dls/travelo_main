<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030303" />
    <meta name="description" content="Travelo - Institutional Grade Travel Intelligence" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <title>Travelo | Elite Adventure Journal</title>
    <style>
      :root { --orange: #FF4D00; --cyan: #00F0FF; --yellow: #EAFF00; }
      body { background-color: #030303 !important; color: white !important; font-family: 'Plus Jakarta Sans', sans-serif !important; margin: 0; padding: 0; overflow-x: hidden; }
      .header-massive { font-family: 'Bebas Neue', cursive !important; text-transform: uppercase !important; line-height: 0.75 !important; letter-spacing: -0.05em !important; font-size: clamp(4rem, 15vw, 15rem) !important; }
      .font-marker { font-family: 'Permanent Marker', cursive !important; }
      .silicon-glass { background: rgba(255, 255, 255, 0.03) !important; backdrop-filter: blur(60px) !important; -webkit-backdrop-filter: blur(60px) !important; border: 1px solid rgba(255, 255, 255, 0.08) !important; border-radius: 2.5rem !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important; }
      .btn-launch { background: var(--orange) !important; color: white !important; font-family: 'Bebas Neue', cursive !important; border-radius: 2.5rem !important; box-shadow: 0 0 40px rgba(255, 77, 0, 0.35) !important; border: none !important; cursor: pointer !important; transition: all 0.3s ease !important; }
      .btn-launch:hover { box-shadow: 0 0 60px rgba(255, 77, 0, 0.6) !important; transform: scale(1.02) !important; }
      .text-orange { color: var(--orange) !important; }
      .text-cyan { color: var(--cyan) !important; }
      @media (max-width: 640px) { .header-massive { font-size: 16vw !important; } }
    </style>
  </head>

    <div id="root"></div>
  </body>
